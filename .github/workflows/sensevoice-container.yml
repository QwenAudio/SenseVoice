name: SenseVoice container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yaml
      - requirements.txt
      - api.py
      - model.py
      - utils/device_env.py
      - README.md
      - README_zh.md
      - README_ja.md
      - CONTRIBUTING.md
      - .github/workflows/sensevoice-container.yml
      - tests/test_container_contract.py
      - tests/test_docker_context.sh
      - tests/test_device_env.py
      - tests/test_model_timestamps.py
      - tests/test_ctc_alignment.py
      - utils/ctc_alignment.py
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yaml
      - requirements.txt
      - api.py
      - model.py
      - utils/device_env.py
      - README.md
      - README_zh.md
      - README_ja.md
      - CONTRIBUTING.md
      - .github/workflows/sensevoice-container.yml
      - tests/test_container_contract.py
      - tests/test_docker_context.sh
      - tests/test_device_env.py
      - tests/test_model_timestamps.py
      - tests/test_ctc_alignment.py
      - utils/ctc_alignment.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sensevoice-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate container contract
        run: python -m unittest tests.test_container_contract tests.test_device_env
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch for model contracts
        run: python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate module and timestamp contracts
        run: python -m unittest tests.test_model_timestamps tests.test_ctc_alignment -v

  build:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3

      - name: Verify Docker build context exclusions
        run: bash tests/test_docker_context.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sensevoice
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
